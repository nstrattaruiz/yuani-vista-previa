  <div class="yu-anuncio" id="anuncio" hidden></div>

  <!-- ============ Firma NS: header píldora + ☰ en círculo + menú grande (adaptado a Yuan) ============ -->
  <header class="ns-header" id="ns-header">
    <button class="ns-menu-btn" type="button" aria-expanded="false" aria-controls="ns-panel" aria-label="Abrir menú">
      <span class="ns-menu-btn__lines" aria-hidden="true"><span></span><span></span></span>
    </button>
    <div class="ns-bar">
      <a class="ns-brand yu-marca" href="/" data-link aria-label="Yuan Import, ir al inicio" id="marca">
        <span class="yu-logo" aria-hidden="true">yuani</span>
      </a>
      <nav class="ns-nav yu-nav" aria-label="Principal" id="nav"></nav>
      <div class="yu-acciones">
        <button class="yu-icono-btn" type="button" id="abrir-buscador" aria-label="Buscar" aria-expanded="false" aria-controls="buscador"><svg aria-hidden="true"><use href="#i-buscar"/></svg></button>
        <button class="yu-icono-btn yu-cuenta-btn" type="button" id="abrir-cuenta" aria-label="Ingresar a tu cuenta" aria-haspopup="dialog" hidden><svg aria-hidden="true"><use href="#i-usuario"/></svg></button>
        <a class="yu-icono-btn yu-solo-compu" href="/favoritos" data-link aria-label="Favoritos" id="ir-favoritos"><svg aria-hidden="true"><use href="#i-corazon"/></svg><b class="yu-burbuja" id="fav-contador" hidden>0</b></a>
        <a class="yu-icono-btn yu-wa" id="wa-header" href="#" target="_blank" rel="noopener" aria-label="Escribinos por WhatsApp" hidden><svg aria-hidden="true"><use href="#i-wa"/></svg></a>
        <button class="yu-carrito-btn" type="button" id="abrir-carrito" aria-label="Abrir carrito, 0 productos" aria-controls="carrito">
          <svg aria-hidden="true"><use href="#i-bolsa"/></svg><b class="yu-burbuja yu-burbuja--carrito" id="contador">0</b>
        </button>
      </div>
    </div>
    <a class="yu-wa-burbuja" id="wa-burbuja" href="#" target="_blank" rel="noopener" aria-label="Escribinos por WhatsApp" data-tip="¿Te ayudamos? Escribinos" hidden><svg aria-hidden="true"><use href="#i-wa"/></svg></a>
    <div class="ns-panel yu-panel" id="ns-panel" aria-hidden="true">
      <nav class="ns-panel__nav yu-panel__nav" aria-label="Menú" id="panel-nav"></nav>
      <div class="ns-panel__info yu-panel__info" id="hablemos"><p class="ns-panel__label">Hablemos</p></div>
    </div>
  </header>
  <div class="ns-scrim" aria-hidden="true"></div>

  <!-- Buscador con resultados mientras escribís -->
  <div class="yu-buscador" id="buscador" role="dialog" aria-modal="true" aria-label="Buscar productos" hidden>
    <form class="yu-buscador__caja" id="buscador-form" role="search" action="/buscar">
      <svg aria-hidden="true"><use href="#i-buscar"/></svg>
      <input type="search" name="q" id="buscador-q" placeholder="Buscá moldes, insumos…" autocomplete="off" aria-label="Buscar" aria-controls="buscador-resultados">
      <button type="button" class="yu-icono-btn" id="cerrar-buscador" aria-label="Cerrar buscador"><svg aria-hidden="true"><use href="#i-cerrar"/></svg></button>
    </form>
    <div class="yu-buscador__resultados" id="buscador-resultados" aria-live="polite"></div>
  </div>

  <main id="app" tabindex="-1"></main>

  <footer class="yu-pie" id="pie"></footer>

  <!-- ============ Firma NS: carrito deslizable con fondo desenfocado ============ -->
  <div class="carrito-velo" id="carrito-velo" hidden></div>
  <aside class="carrito" id="carrito" role="dialog" aria-modal="true" aria-labelledby="carrito-titulo" aria-hidden="true" inert>
    <div class="carrito__asa" aria-hidden="true"><span></span></div>
    <div class="carrito__cab">
      <h2 id="carrito-titulo">Tu carrito <span id="carrito-cantidad"></span></h2>
      <button type="button" class="yu-icono-btn" id="cerrar-carrito" aria-label="Cerrar carrito"><svg aria-hidden="true"><use href="#i-cerrar"/></svg></button>
    </div>
    <div class="carrito__progreso" id="carrito-progreso"></div>
    <div class="carrito__lineas" id="carrito-lineas"></div>
    <div class="carrito__pie" id="carrito-pie"></div>
  </aside>

  <div class="yu-aviso-flotante" id="aviso-agregado" role="status" aria-live="polite"></div>
  <div class="yu-cookies" id="cookies" hidden></div>

  <!-- ============ Firma NS: volver arriba con anillo de progreso ============ -->
  <div class="ns-top" id="ns-top">
    <button type="button" class="ns-top__button" aria-label="Volver arriba">
      <svg class="ns-top__ring" viewBox="0 0 56 56" aria-hidden="true" focusable="false">
        <circle class="ns-top__track" cx="28" cy="28" r="25"/>
        <circle class="ns-top__progress" cx="28" cy="28" r="25" pathLength="1"/>
      </svg>
      <svg class="ns-top__arrow" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <script src="/yuani-vista-previa/v-328b047-mv5klaag/js/ns-firma.js" defer></script>
  <script type="module" src="/yuani-vista-previa/v-328b047-mv5klaag/js/app.js"></script>
</body>
</html>
